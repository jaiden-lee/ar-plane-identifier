<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <title>SkyLens</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <!-- The AR view opens on launch. Settings are hidden until opened (⚙ or long-press), or shown
         with an error if the view can't start. -->
    <div id="settings-screen" hidden>
      <h1>⚙ Settings</h1>
      <!-- Landscape-locked app: fields in a grid so everything fits without scrolling.
           Radius comes first so the keyboard doesn't cover it. -->
      <div class="fields">
        <label>
          Search radius (km)
          <input id="radius-input" type="number" min="1" max="400" step="1" inputmode="numeric" placeholder="default: 20" />
        </label>
        <label>
          Camera
          <select id="camera-select"></select>
        </label>
        <label>
          Lens spacing (mm)
          <input id="ipd-input" type="number" min="50" max="80" step="1" inputmode="numeric" />
        </label>
      </div>
      <button id="done-btn">Done</button>
      <p class="hint">
        Shows live planes within the search radius of your GPS position.<br />
        In view: double-tap middle = fine-tune (then middle = next setting, left/right = adjust) · ⚙ top right or long-press = these settings · back = exit
      </p>
      <p id="settings-status"></p>
    </div>
    <div id="stereo" hidden></div>
    <button id="settings-btn" hidden aria-label="Settings">⚙</button>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
