<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <title>Plane Spotter AR</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="start-screen">
      <h1>✈ Plane Spotter AR</h1>
      <label>
        Phone
        <select id="preset-select"></select>
      </label>
      <label>
        Lens spacing (mm)
        <input id="ipd-input" type="number" min="50" max="80" step="1" />
      </label>
      <label>
        Camera
        <select id="camera-select"></select>
      </label>
      <label>
        Data
        <select id="data-select">
          <option value="demo">Demo snapshot (Georgia Tech)</option>
          <option value="live">Live (GPS)</option>
          <option value="fixture">Offline (no backend)</option>
        </select>
      </label>
      <label>
        Search radius (km)
        <input id="radius-input" type="number" min="1" max="400" step="1" inputmode="numeric" placeholder="default: 15 live / 40 demo" />
      </label>
      <label class="checkbox">
        <input id="voice-check" type="checkbox" />
        Voice ("Hey Grok")
      </label>
      <label class="checkbox">
        <input id="cast-check" type="checkbox" />
        Cast to laptop (open /cast.html there)
      </label>
      <button id="start-btn">Start</button>
      <p class="hint">In view: double-tap middle = calibrate (then middle = next setting, left/right = adjust) · long-press = back to this screen</p>
      <p id="start-status"></p>
    </div>
    <div id="stereo" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
